version: '3.8'

services:
  mysql:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Sparni_Timekla_Vietne
      MYSQL_USER: eliteunit
      MYSQL_PASSWORD: parole
    ports:
      - "3306:3306"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/Sparni_Timekla_Vietne
      SPRING_DATASOURCE_USERNAME: eliteunit
      SPRING_DATASOURCE_PASSWORD: parole
